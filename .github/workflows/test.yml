name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # Python 3.8 is no longer installable by setup-python on the newest
    # ubuntu-latest image (Ubuntu 26.04), so the 3.8 leg runs on 22.04. The job
    # name is kept as "test (<version>)".
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
          - python-version: '3.12'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -v
      - name: The example registry is valid
        run: PYTHONPATH=src python -m arcade check-registry examples/games.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arcade:ci .
      - name: The image serves its health check
        run: |
          mkdir -p cfg && cp examples/games.yaml cfg/games.yaml
          docker run -d --name arcade -p 8080:8080 -v "$PWD/cfg:/config:ro" arcade:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(docker inspect -f '{{.State.Running}}' arcade)" = true

  engine:
    # The hall's engine (hall3d/main.cpp) is committed built
    # (src/arcade/hall_assets/hall-engine.*), so the image needs no build step.
    # This rebuilds it with the pinned emsdk and Strata release and fails if
    # the result differs from what is committed: the build is reproducible
    # (gzip -n, fixed toolchain), so a difference means a stale engine.
    name: engine (the committed wasm is what hall3d builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: emsdk 6.0.11
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11
      - name: Build the hall's engine
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --version | head -1
          bash hall3d/build.sh
      - name: The committed engine matches the build
        run: |
          sha256sum src/arcade/hall_assets/hall-engine.*
          if ! git diff --quiet -- src/arcade/hall_assets/; then
            git diff --stat -- src/arcade/hall_assets/
            echo "::error::src/arcade/hall_assets/hall-engine.* differ from hall3d/main.cpp's build; run hall3d/build.sh and commit the result"
            exit 1
          fi
